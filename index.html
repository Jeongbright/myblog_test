<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Blog</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/theme.js"></script>
</head>
<body>
<header class="site-header">
  <a class="site-title" href="index.html">My Blog</a>
  <button class="theme-toggle" aria-label="다크 모드로 전환"></button>
</header>

<main>
  <section class="apps-section">
    <h2 class="section-title">미니 웹앱</h2>
    <ul class="app-list">
      <li class="app-card">
        <a class="app-card-link" href="apps/2048/index.html">
          <div class="app-preview">
            <iframe src="apps/2048/index.html" title="2048 미리보기" loading="lazy" tabindex="-1"></iframe>
          </div>
          <div class="app-card-body">
            <h3 class="app-card-title">2048</h3>
            <p class="app-card-desc">방향키나 스와이프로 숫자 타일을 밀어 합치는 퍼즐 게임. 점수판과 최고 기록을 지원합니다.</p>
          </div>
        </a>
      </li>
      <li class="app-card">
        <a class="app-card-link" href="apps/pixel-art-editor/index.html">
          <div class="app-preview app-preview--pixel">
            <iframe src="apps/pixel-art-editor/index.html" title="픽셀 아트 에디터 미리보기" loading="lazy" tabindex="-1"></iframe>
          </div>
          <div class="app-card-body">
            <h3 class="app-card-title">픽셀 아트 에디터</h3>
            <p class="app-card-desc">16×16 격자에 도트를 찍어 그림을 그리고 PNG로 저장하는 도구. 색상 팔레트를 지원합니다.</p>
          </div>
        </a>
      </li>
    </ul>
  </section>

  <ul id="post-list" class="post-list"></ul>
</main>

<script src="js/main.js"></script>
</body>
</html>
